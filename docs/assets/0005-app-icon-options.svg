<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" role="img" aria-labelledby="title description">
  <title id="title">Egg Cooker application icon options</title>
  <desc id="description">Three square icon studies: a smaller whole egg, a larger fully contained egg, and an egg with cooking heat marks.</desc>
  <rect width="1080" height="410" fill="#fffdf7" />

  <defs>
    <radialGradient id="yolk" cx="34%" cy="28%">
      <stop stop-color="#ffba39" />
      <stop offset="0.62" stop-color="#ee8b10" />
      <stop offset="1" stop-color="#d46a09" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#49351c" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(45 34)">
    <rect width="280" height="280" rx="58" fill="#f8f5ec" />
    <g transform="translate(56 21) scale(.7)" filter="url(#shadow)">
      <path d="M120 14C78 14 29 98 29 156C29 214 68 244 120 244C172 244 211 214 211 156C211 98 162 14 120 14Z" fill="#fffdf4" stroke="#483821" stroke-width="5" />
      <circle cx="120" cy="151" r="58" fill="#ecac32" stroke="#ce851a" stroke-width="2" />
      <circle cx="120" cy="151" r="46" fill="url(#yolk)" />
      <ellipse cx="103" cy="129" rx="13" ry="7" transform="rotate(-28 103 129)" fill="#fff8cd" opacity=".72" />
    </g>
    <text x="140" y="326" text-anchor="middle" fill="#322c24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">1 · Whole egg</text>
  </g>

  <g transform="translate(400 34)">
    <rect width="280" height="280" rx="58" fill="#f8f5ec" />
    <g transform="translate(28 15) scale(.93)" filter="url(#shadow)">
      <path d="M120 14C78 14 29 98 29 156C29 214 68 244 120 244C172 244 211 214 211 156C211 98 162 14 120 14Z" fill="#fffdf4" stroke="#483821" stroke-width="4.1" />
      <circle cx="120" cy="151" r="58" fill="#ecac32" stroke="#ce851a" stroke-width="1.8" />
      <circle cx="120" cy="151" r="47" fill="url(#yolk)" />
      <ellipse cx="101" cy="127" rx="15" ry="8" transform="rotate(-28 101 127)" fill="#fff8cd" opacity=".72" />
    </g>
    <text x="140" y="326" text-anchor="middle" fill="#322c24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">2 · Bold egg</text>
    <text x="140" y="352" text-anchor="middle" fill="#795312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">SELECTED</text>
  </g>

  <g transform="translate(755 34)">
    <rect width="280" height="280" rx="58" fill="#f8f5ec" />
    <g fill="none" stroke="#a66000" stroke-width="7" stroke-linecap="round">
      <path d="M85 64C72 52 76 38 88 27" />
      <path d="M140 52C127 40 131 25 143 14" />
      <path d="M195 64C182 52 186 38 198 27" />
    </g>
    <g transform="translate(56 45) scale(.7)" filter="url(#shadow)">
      <path d="M120 14C78 14 29 98 29 156C29 214 68 244 120 244C172 244 211 214 211 156C211 98 162 14 120 14Z" fill="#fffdf4" stroke="#483821" stroke-width="5" />
      <circle cx="120" cy="151" r="58" fill="#ecac32" stroke="#ce851a" stroke-width="2" />
      <circle cx="120" cy="151" r="46" fill="url(#yolk)" />
      <ellipse cx="103" cy="129" rx="13" ry="7" transform="rotate(-28 103 129)" fill="#fff8cd" opacity=".72" />
    </g>
    <text x="140" y="326" text-anchor="middle" fill="#322c24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">3 · Cooking egg</text>
  </g>
</svg>
